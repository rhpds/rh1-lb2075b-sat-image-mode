# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: true
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "This lab guides participants through registering a RHEL image mode (bootc) host to Red Hat Satellite 6.19 and using Satellite to build, push, and deploy a customized container-based OS image. Participants configure Satellite products and activation keys, register the host via the hammer CLI, customize a bootc container image with Podman on a builder node, and apply the update through Satellite remote jobs. The lab covers the full image mode lifecycle — registration, image customization, and deployment — in approximately 30 minutes."
    module_summaries:
      - title: "Image Mode Introduction"
        overview: "Introduces RHEL image mode (bootc) concepts and the lab environment of one Satellite server and two RHEL 10 hosts. Participants log into the Satellite Web UI using provided credentials."
      - title: "Create Container Repository"
        overview: "Creates a 'bootc' product in the Satellite Web UI to serve as the container repository for storing image mode images."
      - title: "Create Activation Key"
        overview: "Creates a 'bootc' activation key in Satellite assigned to the Library lifecycle environment with the Default Organization View, which will be used to register the image mode host."
      - title: "Register Image Mode Host"
        overview: "Uses the hammer CLI on satellite.lab to generate a host registration command and pipes it via SSH into rhel2, registering the pre-built image mode host with Satellite."
      - title: "Verify Image Mode Host Details"
        overview: "Explores the Container Images section in Satellite Web UI, schedules a Bootc Status remote job against rhel2, and reviews the image mode details card on the host detail page."
      - title: "Update Container Image"
        overview: "Creates a Containerfile on rhel1 extending rhel10/rhel-bootc:10.1 with a custom MOTD, then builds the new bootc image with Podman and tags it for the Satellite registry."
      - title: "Push Container Image"
        overview: "Logs into the Satellite embedded container registry from rhel1 and pushes the newly built bootc image so it is available for deployment."
      - title: "Obtain Image Label"
        overview: "Navigates the Satellite Web UI to find the published image tag URL (the 'Published At' field) needed to target the new image in the Bootc Switch remote job."
      - title: "Schedule Remote Job"
        overview: "Schedules a Bootc Switch remote job targeting rhel2, uses bootc status to verify the staged image, reboots rhel2 into the new image, and confirms the updated MOTD is displayed."
    rcars_overlap_pct: null
    rcars_top_matches: []
    rejections: []

